<style>
.customer-bottom-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: min(100%, 500px);
  z-index: 80;
  padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 12px);

  background: linear-gradient(
      180deg,
      #6b0f12 0%,
      #561013 45%,
      #3b0a0d 100%
  );

  border-top-left-radius: 24px;
  border-top-right-radius: 24px;

  box-shadow: 0 -10px 30px rgba(0,0,0,.35);

  border-top: 1px solid rgba(212,160,23,.25);
}

.customer-bottom-nav__inner {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.customer-nav-item {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 58px;
  padding: 8px 6px;
  border-radius: 18px;
  color: rgba(236, 245, 238, .76);
  text-decoration: none;
  font-family: inherit;
  font-weight: 700;
  letter-spacing: .2px;
  transition: transform .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease;
}

.customer-nav-item:active,
.customer-nav-item:hover,
.customer-nav-item:active{
    background:rgba(212,160,23,.12);
    color:#ffffff;
}

.customer-nav-item.is-active{

    background:linear-gradient(
        180deg,
        #d4a017 0%,
        #b8860b 100%
    );

    color:#ffffff;

    box-shadow:0 8px 18px rgba(212,160,23,.35);

    transform:translateY(-2px);
}

.customer-nav-icon{
    font-size:22px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

.customer-nav-label {
  font-size: 11px;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}

@media (max-width: 380px) {
  .customer-bottom-nav {
    padding-inline: 8px;
  }

    .customer-bottom-nav__inner {
        gap: 6px;
    }

  .customer-nav-item {
    min-height: 54px;
    padding-inline: 4px;
  }

  .customer-nav-icon {
    font-size: 20px;
  }

  .customer-nav-label {
    font-size: 10px;
  }
}
</style>

{% set nav_table = table if table else '' %}
<nav class="customer-bottom-nav" aria-label="Customer navigation">
  <div class="customer-bottom-nav__inner">
    <a class="customer-nav-item {% if nav_active == 'menu' %}is-active{% endif %}" href="{{ '/menu' ~ ('?table=' ~ nav_table if nav_table else '') }}">
      <span class="customer-nav-icon">🍽</span>
      <span class="customer-nav-label">Menu</span>
    </a>
    <a class="customer-nav-item {% if nav_active == 'cart' %}is-active{% endif %}" href="{{ '/cart' ~ ('?table=' ~ nav_table if nav_table else '') }}">
      <span class="customer-nav-icon">🛒</span>
      <span class="customer-nav-label">Cart</span>
    </a>
    <a class="customer-nav-item {% if nav_active == 'orders' %}is-active{% endif %}" href="{{ '/orders' ~ ('?table=' ~ nav_table if nav_table else '') }}">
      <span class="customer-nav-icon">⏱</span>
      <span class="customer-nav-label">Orders</span>
    </a>
    <a class="customer-nav-item {% if nav_active == 'bill' %}is-active{% endif %}" href="{{ '/bill' ~ ('?table=' ~ nav_table if nav_table else '') }}">
      <span class="customer-nav-icon">🧾</span>
      <span class="customer-nav-label">Bill</span>
    </a>
  </div>
</nav>
